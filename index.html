<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Song Interpretations and Recommendations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --pink-bg: #f3add0;
    --pink-panel: #f9c8de;
    --cream: #fff2f8;
    --ink: #16215c;
    --ink-bright: #3247d1;
    --gold: #e8a11c;
    --line: #d67aa8;
    --line-soft: #e6a9c6;
    --err: #a3123a;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--pink-bg);
    background-image:
      radial-gradient(circle at 12% 8%, rgba(255,255,255,0.35), transparent 40%),
      radial-gradient(circle at 90% 85%, rgba(255,255,255,0.25), transparent 45%);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    min-height: 100vh;
    display:flex;
    justify-content:center;
    padding: 48px 18px 80px;
  }

  .sleeve{ width:100%; max-width: 620px; }

  /* ---- Stamp (high-contrast, mode-aware) ---- */
  .stamp{
    width: 150px; height: 150px; border-radius:50%;
    margin: 0 auto 24px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    padding: 14px; transform: rotate(-5deg);
    background: var(--ink);
    border: 4px solid var(--pop);
    box-shadow: 0 0 0 4px var(--ink), 6px 8px 0 -1px rgba(22,33,92,0.28);
    transition: transform 0.15s ease;
  }
  .stamp:hover{ transform: rotate(-5deg) scale(1.03); }
  .stamp-label{
    font-family:'Space Mono', monospace; font-size: 9px; font-weight:700;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--ink); background: var(--pop);
    padding: 2px 9px; border-radius: 20px; margin-bottom: 7px;
  }
  .stamp-title{
    font-family:'Instrument Serif', serif; font-style: italic; font-weight: 700;
    font-size: 21px; line-height: 1.02; color: var(--cream);
    word-break: break-word; max-height: 66px; overflow: hidden;
  }
  .stamp-artist{
    font-family:'Work Sans', sans-serif; font-weight: 600; font-size: 11px;
    letter-spacing: 0.02em; color: var(--pop); margin-top: 6px;
    word-break: break-word; max-height: 30px; overflow: hidden;
  }
  /* Song = electric blue ring/accent; Album = warm gold ring/accent. */
  .stamp.stamp--song{ --pop: var(--ink-bright); }
  .stamp.stamp--album{ --pop: var(--gold); }
  .stamp.stamp--idle{ --pop: var(--pink-panel); }
  .stamp.stamp--idle .stamp-title{ color: var(--pink-panel); font-style: normal; }
  .stamp.stamp--idle .stamp-label{ color: var(--ink); }

  header{ text-align:center; margin-bottom: 22px; }
  h1{
    font-family:'Instrument Serif', serif; font-style: normal; font-weight: 700;
    font-size: 44px; line-height:1.05; margin: 0; color: var(--ink);
  }

  /* ---- Mode toggle ---- */
  .mode-toggle{
    display:flex; gap: 0; margin: 0 0 14px; border: 2px solid var(--ink);
    border-radius: 10px; overflow: hidden; background: var(--cream);
  }
  .mode-toggle button{
    flex: 1; font-family:'Space Mono', monospace; font-size: 12px; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase; padding: 9px 0;
    border: none; background: transparent; color: var(--ink); cursor: pointer;
  }
  .mode-toggle button + button{ border-left: 2px solid var(--ink); }
  .mode-toggle button.active-song{ background: var(--ink-bright); color: var(--cream); }
  .mode-toggle button.active-album{ background: var(--gold); color: var(--ink); }

  /* ---- Cue box ---- */
  .cue{
    background: var(--pink-panel);
    border: 2px solid var(--ink);
    border-radius: 14px;
    padding: 16px;
    margin: 30px 0;
  }
  .cue-row{ display:flex; gap:10px; }
  .cue input{
    flex:1;
    font-family:'Work Sans', sans-serif;
    font-size: 15px;
    padding: 11px 14px;
    border-radius: 8px;
    border: 2px solid var(--ink);
    background: var(--cream);
    color: var(--ink);
    outline: none;
  }
  .cue input::placeholder{ color: #8a7590; }
  .cue button{
    font-family:'Space Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    background: var(--ink);
    color: var(--pink-panel);
    border: none;
    border-radius: 8px;
    padding: 0 18px;
    cursor: pointer;
  }
  .cue button:hover:not(:disabled){ background: var(--ink-bright); }
  .cue button:disabled{ opacity: 0.6; cursor: default; }
  .cue-status{
    font-family:'Space Mono', monospace;
    font-size: 12px;
    color: var(--ink);
    margin: 10px 2px 0;
  }
  .cue-status.error{ color: var(--err); }

  /* ---- Now playing ---- */
  .now-playing{ text-align:center; margin-bottom: 8px; }
  .now-playing .eyebrow{
    font-family:'Space Mono', monospace;
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--ink-bright); margin: 0 0 4px;
  }
  .now-playing .title{
    font-family:'Instrument Serif', serif; font-style: italic; font-size: 30px; margin: 0;
  }
  .now-playing .artist{
    font-family:'Work Sans', sans-serif; font-size: 15px; font-weight: 500; margin: 2px 0 0;
  }
  .now-playing .album{
    font-family:'Space Mono', monospace; font-size: 12px; color: var(--ink);
    opacity: 0.65; margin: 4px 0 0; letter-spacing: 0.02em;
  }

  /* ---- Card / liner notes ---- */
  .liner{
    background: var(--cream); border: 2px solid var(--ink); border-radius: 18px;
    padding: 8px 30px 26px; margin-top: 26px;
  }
  .track{ padding: 22px 0; border-bottom: 1px dashed var(--line); }
  .track:last-child{ border-bottom: none; }
  .track-head{ display:flex; align-items: baseline; gap: 12px; margin-bottom: 8px; }
  .track-num{
    font-family:'Space Mono', monospace; font-size: 13px; font-weight:700;
    color: var(--ink-bright); min-width: 26px;
  }
  .track-title{ font-family:'Instrument Serif', serif; font-style: italic; font-size: 23px; margin:0; }
  .track p{ margin: 0; font-size: 15.5px; line-height: 1.62; padding-left: 38px; }

  /* ---- B-side recs ---- */
  .bside{
    margin-top: 30px; background: var(--pink-panel); border: 2px solid var(--ink);
    border-radius: 18px; padding: 24px 26px 8px;
  }
  .bside-head{
    font-family:'Space Mono', monospace; font-size: 12px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--ink); margin: 0 0 14px;
  }
  .rec{ display:flex; gap: 12px; padding: 14px 0; border-bottom: 1px dashed var(--line-soft); }
  .rec:last-child{ border-bottom: none; }
  .rec-num{
    font-family:'Space Mono', monospace; font-size: 13px; color: var(--ink-bright);
    font-weight:700; min-width: 20px;
  }
  .rec-body b{ font-family:'Work Sans', sans-serif; font-weight:600; }
  .rec-body p{ margin: 4px 0 0; font-size: 14.5px; line-height:1.55; }

  /* ---- Loading / error states ---- */
  .state-box{
    text-align:center;
    padding: 40px 20px;
    font-family:'Space Mono', monospace;
    font-size: 13px;
    color: var(--ink);
  }
  .state-box.error{ color: var(--err); }

  /* ---- Archive ---- */
  .archive-bar{ text-align:center; margin: -14px 0 0; }
  .archive-link{
    font-family:'Space Mono', monospace; font-size: 12px; letter-spacing: 0.06em;
    text-transform: uppercase; background: none; border: none; cursor: pointer;
    color: var(--ink-bright); padding: 4px 6px; text-decoration: underline;
  }
  .archive-link:hover{ color: var(--ink); }
  .archive-panel{
    margin-top: 18px; background: var(--cream); border: 2px solid var(--ink);
    border-radius: 18px; padding: 18px 22px 22px;
  }
  .archive-filter{
    width: 100%; font-family:'Work Sans', sans-serif; font-size: 14px;
    padding: 9px 12px; border-radius: 8px; border: 2px solid var(--ink);
    background: var(--pink-panel); color: var(--ink); outline: none; margin-bottom: 6px;
  }
  .archive-filter::placeholder{ color: #8a7590; }
  .archive-item{
    width: 100%; text-align: left; background: none; border: none; cursor: pointer;
    padding: 12px 4px; border-bottom: 1px dashed var(--line);
    display: flex; align-items: baseline; gap: 8px;
  }
  .archive-item:last-child{ border-bottom: none; }
  .archive-item:hover .archive-song{ color: var(--ink-bright); }
  .archive-tag{
    font-family:'Space Mono', monospace; font-size: 9px; font-weight:700;
    letter-spacing: 0.08em; padding: 2px 6px; border-radius: 5px;
    align-self: center; flex: none;
  }
  .archive-tag--song{ background: var(--ink-bright); color: var(--cream); }
  .archive-tag--album{ background: var(--gold); color: var(--ink); }
  .archive-song{ font-family:'Instrument Serif', serif; font-style: italic; font-size: 18px; color: var(--ink); }
  .archive-artist{ font-family:'Work Sans', sans-serif; font-size: 13px; color: var(--ink); opacity: 0.7; }
  .archive-empty{
    font-family:'Space Mono', monospace; font-size: 12px; color: var(--ink);
    opacity: 0.7; text-align:center; padding: 20px 0;
  }

  footer{
    text-align:center; margin-top: 34px; font-family:'Space Mono', monospace;
    font-size: 11px; color: var(--ink); opacity: 0.7; letter-spacing: 0.04em;
  }

  @media (max-width: 480px){
    h1{ font-size: 34px; }
    .liner{ padding: 8px 18px 20px; }
    .track p{ padding-left: 0; margin-top: 4px; }
    .track-head{ flex-wrap: wrap; }
  }
</style>
</head>
<body>

<div class="sleeve">

  <div class="stamp stamp--idle" id="stampBox">
    <span class="stamp-label" id="stampLabel">Song Lens</span>
    <span class="stamp-title" id="stampTitle">Cue Up</span>
    <span class="stamp-artist" id="stampArtist">a song or album</span>
  </div>

  <header>
    <h1>Song &amp; Album<br>Interpretations</h1>
  </header>

  <div class="cue">
    <div class="mode-toggle" id="modeToggle">
      <button type="button" id="modeSong" class="active-song" onclick="setMode('song')">Song</button>
      <button type="button" id="modeAlbum" onclick="setMode('album')">Album</button>
    </div>
    <div class="cue-row">
      <input type="text" id="cueInput" placeholder="Song — Artist" oninput="updateCueButton()" onkeydown="if(event.key==='Enter')analyzeSong()">
      <button id="cueBtn" onclick="analyzeSong()" disabled>Cue Up</button>
    </div>
    <p class="cue-status" id="cueStatus"></p>
  </div>

  <div class="archive-bar">
    <button id="browseToggle" class="archive-link" onclick="toggleArchive()">Browse the archive →</button>
  </div>

  <div id="archivePanel" class="archive-panel" style="display:none;">
    <input type="text" id="archiveFilter" class="archive-filter" placeholder="Filter by title or artist..." oninput="renderArchiveList()">
    <div id="archiveList"></div>
  </div>

  <div id="results">
    <div class="state-box">Cue up a song or album above to get started.</div>
  </div>

</div>

<script>
// Point this at your deployed Cloudflare Worker URL.
const WORKER_URL = "https://songlens.scottachs-cloudfare.workers.dev";

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// ---- Mode: 'song' or 'album' -------------------------------------------
let currentMode = 'song';

function setMode(mode){
  currentMode = mode;
  const songBtn = document.getElementById('modeSong');
  const albumBtn = document.getElementById('modeAlbum');
  songBtn.classList.toggle('active-song', mode === 'song');
  albumBtn.classList.toggle('active-album', mode === 'album');
  document.getElementById('cueInput').placeholder =
    mode === 'album' ? 'Album — Artist' : 'Song — Artist';
  document.getElementById('cueBtn').textContent =
    mode === 'album' ? 'Break It Down' : 'Cue Up';
  // Switching mode should let the same text be searched fresh in the new mode.
  lastSearchedKey = null;
  updateCueButton();
}

// Set the top stamp. state = 'idle' | 'song' | 'album'.
function setStamp(state, title, artist){
  const box = document.getElementById('stampBox');
  box.className = 'stamp stamp--' + state;
  document.getElementById('stampLabel').textContent =
    state === 'album' ? 'Album' : state === 'song' ? 'Song' : 'Song Lens';
  document.getElementById('stampTitle').textContent = title;
  document.getElementById('stampArtist').textContent = artist || '';
}

// ---- Archive of previously-analyzed songs ----
// Fetched once from the Worker's public browse endpoint. Clicking a song
// re-renders its stored analysis instantly — no new API call, no cost.
let archiveData = null;

function toggleArchive(){
  const panel = document.getElementById('archivePanel');
  const toggle = document.getElementById('browseToggle');
  if (panel.style.display === 'none'){
    panel.style.display = 'block';
    toggle.textContent = 'Hide the archive ×';
    if (archiveData === null) loadArchive();
  } else {
    panel.style.display = 'none';
    toggle.textContent = 'Browse the archive →';
  }
}

async function loadArchive(){
  const list = document.getElementById('archiveList');
  list.innerHTML = '<p class="archive-empty">Loading the archive...</p>';
  try{
    const res = await fetch(WORKER_URL + '?browse=1');
    const data = await res.json();
    archiveData = (data && data.songs) ? data.songs : [];
    renderArchiveList();
  } catch(e){
    list.innerHTML = '<p class="archive-empty">Could not load the archive right now.</p>';
  }
}

function renderArchiveList(){
  const list = document.getElementById('archiveList');
  if (!archiveData) return;

  const titleOf = s => (s.mode === 'album' ? s.album : s.song) || s.album || s.song || '';

  const term = document.getElementById('archiveFilter').value.trim().toLowerCase();
  const filtered = term
    ? archiveData.filter(s =>
        titleOf(s).toLowerCase().includes(term) ||
        (s.artist || '').toLowerCase().includes(term))
    : archiveData;

  if (filtered.length === 0){
    list.innerHTML = '<p class="archive-empty">' +
      (archiveData.length === 0 ? 'Nothing analyzed yet — cue something up above.' : 'No matches.') +
      '</p>';
    return;
  }

  // Build buttons and bind each to its own object directly, so a click always
  // resolves even if archiveData is later refreshed or cleared.
  list.innerHTML = '';
  filtered.forEach(item => {
    const btn = document.createElement('button');
    btn.className = 'archive-item';
    const tag = item.mode === 'album'
      ? '<span class="archive-tag archive-tag--album">LP</span>'
      : '<span class="archive-tag archive-tag--song">7&Prime;</span>';
    btn.innerHTML =
      tag +
      '<span class="archive-song">' + escapeHtml(titleOf(item)) + '</span>' +
      '<span class="archive-artist">' + escapeHtml(item.artist || '') + '</span>';
    btn.addEventListener('click', () => showArchived(item));
    list.appendChild(btn);
  });
}

function showArchived(song){
  if (!song) return;
  renderResult(song);
  const anchor = document.getElementById('nowPlayingAnchor');
  if (anchor) anchor.scrollIntoView({ behavior: 'smooth' });
}

// The last query+mode that produced a successful result. Keeps the Cue Up
// button disabled for that exact combo, so re-clicking can't fire a second
// (billed) analysis of something just analyzed. Changing the text OR the mode
// re-enables it.
let lastSearchedKey = null;

function currentKey(){
  return currentMode + '::' + document.getElementById('cueInput').value.trim();
}

// Enable the button only when there's text AND it isn't the exact thing we
// just successfully analyzed in this mode. Empty box or a repeat -> disabled.
function updateCueButton(){
  const btn = document.getElementById('cueBtn');
  if (btn.dataset.busy === '1') return; // mid-search; leave as-is
  const val = document.getElementById('cueInput').value.trim();
  btn.disabled = (val === '' || currentKey() === lastSearchedKey);
}

async function analyzeSong(){
  const query = document.getElementById('cueInput').value.trim();
  const mode = currentMode;
  const statusEl = document.getElementById('cueStatus');
  const btn = document.getElementById('cueBtn');
  const idleLabel = mode === 'album' ? 'Break It Down' : 'Cue Up';

  statusEl.className = 'cue-status';
  statusEl.textContent = '';

  // Guard: ignore empty input and repeats of the last successful search
  // (the Enter key can reach here even when the button itself is disabled).
  if (!query || currentKey() === lastSearchedKey){
    return;
  }

  btn.disabled = true;
  btn.dataset.busy = '1';
  btn.textContent = 'Spinning...';
  setStamp('idle', 'Spinning', mode === 'album' ? 'reading the record' : 'reading the room');
  document.getElementById('results').innerHTML =
    '<div class="state-box">' +
    (mode === 'album'
      ? 'Pulling the record — reading it front to back...'
      : 'Dropping the needle — researching and writing this one up...') +
    '</div>';

  const attempt = async () => {
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query, mode })
    });
    const data = await res.json();
    return { res, data };
  };

  try{
    let res, data;
    try {
      ({ res, data } = await attempt());
    } catch (firstErr) {
      // Transient network hiccups happen — retry once, silently.
      document.getElementById('results').innerHTML = '<div class="state-box">Still working on it — trying once more...</div>';
      ({ res, data } = await attempt());
    }

    if (!res.ok || data.error){
      setStamp('idle', 'Cue Up', 'a song or album');
      document.getElementById('results').innerHTML =
        '<div class="state-box error">' + escapeHtml(data.error || ('Something went wrong (' + res.status + ').')) + '</div>';
      return;
    }

    renderResult(data);
    // Remember this exact query+mode as the last success, so the button stays
    // disabled unless the visitor changes the text or the mode.
    lastSearchedKey = mode + '::' + query;
    // Something new was just added. Drop the cached archive; if the panel is
    // open, reload it now so the new entry appears immediately.
    archiveData = null;
    if (document.getElementById('archivePanel').style.display !== 'none'){
      loadArchive();
    }
    const anchor = document.getElementById('nowPlayingAnchor');
    if (anchor) anchor.scrollIntoView({ behavior: 'smooth' });

  } catch(e){
    setStamp('idle', 'Cue Up', 'a song or album');
    document.getElementById('results').innerHTML =
      '<div class="state-box error">Could not reach the analysis tool. Try again in a moment.</div>';
  } finally {
    btn.dataset.busy = '';
    btn.textContent = idleLabel;
    updateCueButton();
  }
}

function renderResult(d){
  const isAlbum = (d.mode === 'album') || (!d.song && !!d.album && (d.premise || d.arc || d.threads || d.sound || d.why_it_lasts));

  // Top stamp: album shows album+artist; song shows song+artist.
  const stampTitle = isAlbum ? d.album : d.song;
  setStamp(isAlbum ? 'album' : 'song', stampTitle || '', d.artist || '');

  // Now-playing header + meta line.
  const nowTitle = isAlbum ? d.album : d.song;
  const meta = isAlbum
    ? (d.year || '')
    : [d.album, d.year].filter(Boolean).join(' · ');
  const eyebrow = isAlbum ? 'Now Spinning' : 'Now Playing';

  const recLabel = isAlbum
    ? 'B-Side — Albums to Play Next'
    : 'B-Side — Recommended Next Spins';
  const recs = (d.recommendations || []).map((r, i) => `
    <div class="rec">
      <span class="rec-num">${i+1}</span>
      <div class="rec-body">
        <b>${escapeHtml(r.title)} — ${escapeHtml(r.artist)}</b>
        <p>${escapeHtml(r.reason)}</p>
      </div>
    </div>
  `).join('');

  // Section set differs by mode. Empty sections are skipped, which also keeps
  // older archived entries (saved under a previous format) rendering cleanly.
  const sections = isAlbum
    ? [
        { title: 'The Premise', text: d.premise },
        { title: 'The Arc', text: d.arc },
        { title: 'The Threads', text: d.threads },
        { title: 'The Sound', text: d.sound },
        { title: 'Why It Lasts', text: d.why_it_lasts },
      ].filter(s => s.text)
    : [
        { title: 'The Setup', text: d.setup },
        { title: 'The Characters', text: d.characters },
        { title: 'The Psychology', text: d.psychology },
        { title: 'The Music', text: d.music },
        { title: 'Why It Stays With You', text: d.why_it_hits },
      ].filter(s => s.text);

  const tracks = sections.map((s, i) => `
      <div class="track">
        <div class="track-head"><span class="track-num">${String(i+1).padStart(2,'0')}</span><h3 class="track-title">${escapeHtml(s.title)}</h3></div>
        <p>${escapeHtml(s.text)}</p>
      </div>
  `).join('');

  document.getElementById('results').innerHTML = `
    <div class="now-playing" id="nowPlayingAnchor">
      <p class="eyebrow">${eyebrow}</p>
      <h2 class="title">${escapeHtml(nowTitle)}</h2>
      <p class="artist">${escapeHtml(d.artist || '')}</p>
      ${meta ? `<p class="album">${escapeHtml(meta)}</p>` : ''}
    </div>

    <div class="liner">
      ${tracks}
    </div>

    <div class="bside">
      <p class="bside-head">${recLabel}</p>
      ${recs}
    </div>
  `;
}
</script>

</body>
</html>
